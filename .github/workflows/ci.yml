name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/**]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OCAML_LATEST: "5"

jobs:
  hygiene:
    name: Hygiene
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Use opam archive cache
        run: opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install project dependencies
        run: opam install --yes --with-test --with-doc --with-dev-setup --deps-only .

      - name: Check generated package metadata
        run: |
          opam exec -- dune build @opam
          opam lint ./*.opam

      - name: Check formatting and drift
        run: |
          opam exec -- dune fmt
          git diff --check
          git diff --exit-code

  no-service-correctness:
    name: No-service correctness tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Use opam archive cache
        run: opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install test dependencies
        run: opam install --yes --with-test --deps-only .

      - name: Run no-service correctness tests
        run: scripts/test.sh quick --label no-service-correctness

      - name: Upload no-service test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-service-correctness-report
          path: .logs/
          if-no-files-found: ignore

  docs-examples:
    name: Documentation and example build
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Use opam archive cache
        run: opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install project dependencies
        run: opam install --yes --with-test --with-doc --with-dev-setup --deps-only .

      - name: Install example dependencies
        run: opam install --yes eio_main tls-eio tls ca-certs domain-name mirage-crypto-rng

      - name: Build documentation and example targets
        run: opam exec -- dune build @examples @doc

  s3-local-service-integration:
    name: S3 local-service integration tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Use opam archive cache
        run: opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install integration test dependencies
        run: opam install --yes --with-test --deps-only .

      - name: Run local-service integration tests
        run: scripts/test.sh integration --label s3-local-service-integration

      - name: Upload local-service test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-local-service-integration-report
          path: .logs/
          if-no-files-found: ignore

  package-install-build-test-default:
    name: Default package install/build/test (${{ matrix.package }}, ${{ matrix.os }}, OCaml ${{ matrix.ocaml-compiler }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "4.14"
          - "5"
        package:
          - awskit
          - awskit-unix
          - awskit-lwt
          - awskit-lwt-unix
          - awskit-s3
          - awskit-s3-sim
          - awskit-s3-lwt
          - awskit-s3-lwt-unix

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: |
            *.opam
            !awskit-eio.opam
            !awskit-s3-eio.opam

      - name: Use opam archive cache
        run: opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install package test dependencies
        run: opam install --yes --with-test --deps-only "${{ matrix.package }}"

      - name: Build package install and test targets
        run: opam exec -- dune build -p "${{ matrix.package }}" @install @runtest

  package-install-build-test-eio:
    name: Eio package install/build/test (${{ matrix.package }}, ${{ matrix.os }}, OCaml ${{ matrix.ocaml-compiler }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "5.2"
          - "5"
        package:
          - awskit
          - awskit-unix
          - awskit-eio
          - awskit-s3
          - awskit-s3-eio

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: |
            awskit.opam
            awskit-unix.opam
            awskit-eio.opam
            awskit-s3.opam
            awskit-s3-eio.opam

      - name: Use opam archive cache
        run: opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install package test dependencies
        run: opam install --yes --with-test --deps-only "${{ matrix.package }}"

      - name: Build package install and test targets
        run: opam exec -- dune build -p "${{ matrix.package }}" @install @runtest

  ci-required:
    name: Required CI
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - hygiene
      - no-service-correctness
      - docs-examples
      - s3-local-service-integration
      - package-install-build-test-default
      - package-install-build-test-eio
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Summarize required checks
        env:
          HYGIENE: ${{ needs.hygiene.result }}
          NO_SERVICE_CORRECTNESS: ${{ needs.no-service-correctness.result }}
          DOCS_EXAMPLES: ${{ needs.docs-examples.result }}
          S3_LOCAL_SERVICE_INTEGRATION: ${{ needs.s3-local-service-integration.result }}
          PACKAGE_INSTALL_BUILD_TEST_DEFAULT: ${{ needs.package-install-build-test-default.result }}
          PACKAGE_INSTALL_BUILD_TEST_EIO: ${{ needs.package-install-build-test-eio.result }}
        run: |
          failed=0

          check_result() {
            name=$1
            result=$2
            echo "- ${name}: ${result}" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              success)
                ;;
              *)
                echo "::error title=${name} failed::${name} ended with '${result}'"
                failed=1
                ;;
            esac
          }

          echo "### Required CI" >> "$GITHUB_STEP_SUMMARY"
          check_result "Hygiene" "$HYGIENE"
          check_result "No-service correctness tests" "$NO_SERVICE_CORRECTNESS"
          check_result "Documentation and example build" "$DOCS_EXAMPLES"
          check_result "S3 local-service integration tests" "$S3_LOCAL_SERVICE_INTEGRATION"
          check_result "Default package install/build/test matrix" "$PACKAGE_INSTALL_BUILD_TEST_DEFAULT"
          check_result "Eio package install/build/test matrix" "$PACKAGE_INSTALL_BUILD_TEST_EIO"

          exit "$failed"
