name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/**]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OCAML_LATEST: "5"

jobs:
  package-metadata:
    name: Package metadata
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Run package metadata check
        run: scripts/check.sh package-metadata

  package-test-default:
    name: Default package install/test (${{ matrix.package }}, ${{ matrix.os }}, OCaml ${{ matrix.ocaml-compiler }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "4.14"
          - "5"
        package:
          - awskit
          - awskit-unix
          - awskit-lwt
          - awskit-lwt-unix
          - awskit-s3
          - awskit-s3-sim
          - awskit-s3-lwt
          - awskit-s3-lwt-unix

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: |
            *.opam
            !awskit-eio.opam
            !awskit-s3-eio.opam

      - name: Run package install/test check
        run: scripts/check.sh package --package "${{ matrix.package }}"

  package-test-eio:
    name: Eio package install/test (${{ matrix.package }}, ${{ matrix.os }}, OCaml ${{ matrix.ocaml-compiler }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "5.2"
          - "5"
        package:
          - awskit
          - awskit-unix
          - awskit-eio
          - awskit-s3
          - awskit-s3-eio

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: |
            awskit.opam
            awskit-unix.opam
            awskit-eio.opam
            awskit-s3.opam
            awskit-s3-eio.opam

      - name: Run package install/test check
        run: scripts/check.sh package --package "${{ matrix.package }}"

  docs-examples:
    name: Documentation and examples
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Run documentation and example checks
        run: scripts/check.sh docs-examples

  no-network-correctness:
    name: No-network correctness
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Build no-network correctness evidence
        run: scripts/check.sh no-network --label no-network-correctness

      - name: Upload no-network correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-network-correctness-report
          path: .logs/
          if-no-files-found: ignore

  s3-minio-integration:
    name: S3 MinIO integration
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Run MinIO integration checks
        run: scripts/check.sh minio --label s3-minio-integration

      - name: Upload MinIO integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-minio-integration-report
          path: .logs/
          if-no-files-found: ignore

  ci-required:
    name: Required CI
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - package-metadata
      - package-test-default
      - package-test-eio
      - docs-examples
      - no-network-correctness
      - s3-minio-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Summarize required checks
        env:
          PACKAGE_METADATA: ${{ needs.package-metadata.result }}
          PACKAGE_TEST_DEFAULT: ${{ needs.package-test-default.result }}
          PACKAGE_TEST_EIO: ${{ needs.package-test-eio.result }}
          DOCS_EXAMPLES: ${{ needs.docs-examples.result }}
          NO_NETWORK_CORRECTNESS: ${{ needs.no-network-correctness.result }}
          S3_MINIO_INTEGRATION: ${{ needs.s3-minio-integration.result }}
        run: |
          failed=0

          check_result() {
            name=$1
            result=$2
            echo "- ${name}: ${result}" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              success)
                ;;
              *)
                echo "::error title=${name} failed::${name} ended with '${result}'"
                failed=1
                ;;
            esac
          }

          echo "### Required CI" >> "$GITHUB_STEP_SUMMARY"
          check_result "Package metadata" "$PACKAGE_METADATA"
          check_result "Default package install/test matrix" "$PACKAGE_TEST_DEFAULT"
          check_result "Eio package install/test matrix" "$PACKAGE_TEST_EIO"
          check_result "Documentation and examples" "$DOCS_EXAMPLES"
          check_result "No-network correctness" "$NO_NETWORK_CORRECTNESS"
          check_result "S3 MinIO integration" "$S3_MINIO_INTEGRATION"

          exit "$failed"
