name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/**]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OCAML_LATEST: "5"
  DEFAULT_OPAM_PACKAGES: >-
    awskit awskit-unix awskit-lwt awskit-lwt-unix awskit-s3 awskit-s3-sim awskit-s3-lwt awskit-s3-lwt-unix
  DEFAULT_DUNE_PACKAGES: >-
    awskit,awskit-unix,awskit-lwt,awskit-lwt-unix,awskit-s3,awskit-s3-sim,awskit-s3-lwt,awskit-s3-lwt-unix
  EIO_OPAM_PACKAGES: >-
    awskit awskit-unix awskit-eio awskit-s3 awskit-s3-eio
  EIO_DUNE_PACKAGES: >-
    awskit,awskit-unix,awskit-eio,awskit-s3,awskit-s3-eio
  MINIO_OPAM_PACKAGES: >-
    awskit awskit-unix awskit-lwt awskit-lwt-unix awskit-eio
    awskit-s3 awskit-s3-lwt awskit-s3-lwt-unix awskit-s3-eio
  EXAMPLE_OPAM_PACKAGES: >-
    eio_main tls-eio tls ca-certs domain-name mirage-crypto-rng

jobs:
  package-metadata:
    name: Package metadata
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install maintenance dependencies
        run: opam install --with-test --with-doc --with-dev-setup --deps-only .

      - name: Validate generated opam files
        run: opam exec -- dune build @opam

      - name: Lint opam files
        run: opam lint ./*.opam

      - name: Check formatting and generated-file drift
        run: |
          opam exec -- dune fmt
          git diff --check
          git diff --exit-code

  build-test-default:
    name: Default packages (${{ matrix.os }}, OCaml ${{ matrix.ocaml-compiler }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "4.14"
          - "5"
        local-packages:
          - |
            *.opam
            !awskit-eio.opam
            !awskit-s3-eio.opam

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: ${{ matrix.local-packages }}

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.DEFAULT_OPAM_PACKAGES }}

      - name: Build packages
        run: opam exec -- dune build -p "${{ env.DEFAULT_DUNE_PACKAGES }}" @install

      - name: Run tests
        run: opam exec -- dune build -p "${{ env.DEFAULT_DUNE_PACKAGES }}" @runtest

  build-test-eio:
    name: Eio packages (${{ matrix.os }}, OCaml ${{ matrix.ocaml-compiler }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "5.2"
          - "5"
        local-packages:
          - |
            awskit.opam
            awskit-unix.opam
            awskit-eio.opam
            awskit-s3.opam
            awskit-s3-eio.opam

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: ${{ matrix.local-packages }}

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.EIO_OPAM_PACKAGES }}

      - name: Build packages
        run: opam exec -- dune build -p "${{ env.EIO_DUNE_PACKAGES }}" @install

      - name: Run tests
        run: opam exec -- dune build -p "${{ env.EIO_DUNE_PACKAGES }}" @runtest

  docs-examples:
    name: Documentation and examples
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install documentation and example dependencies
        run: |
          opam install --with-test --with-doc --deps-only .
          opam install ${{ env.EXAMPLE_OPAM_PACKAGES }}

      - name: Build examples and documentation
        run: opam exec -- dune build @examples @doc

  no-network-correctness:
    name: No-network correctness
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install dependencies
        run: opam install --with-test --with-doc --with-dev-setup --deps-only .

      - name: Build no-network correctness evidence
        run: scripts/test-report.sh quick --label no-network-correctness

      - name: Upload no-network correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-network-correctness-report
          path: .logs/
          if-no-files-found: ignore

  s3-minio-integration:
    name: S3 MinIO integration
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.MINIO_OPAM_PACKAGES }}

      - name: Run MinIO integration checks
        run: scripts/test-report.sh integration --label s3-minio-integration

      - name: Upload MinIO integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-minio-integration-report
          path: .logs/
          if-no-files-found: ignore

  ci-required:
    name: Required CI
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs:
      - package-metadata
      - build-test-default
      - build-test-eio
      - docs-examples
      - no-network-correctness
      - s3-minio-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Summarize required checks
        env:
          PACKAGE_METADATA: ${{ needs.package-metadata.result }}
          BUILD_TEST_DEFAULT: ${{ needs.build-test-default.result }}
          BUILD_TEST_EIO: ${{ needs.build-test-eio.result }}
          DOCS_EXAMPLES: ${{ needs.docs-examples.result }}
          NO_NETWORK_CORRECTNESS: ${{ needs.no-network-correctness.result }}
          S3_MINIO_INTEGRATION: ${{ needs.s3-minio-integration.result }}
        run: |
          failed=0

          check_result() {
            name=$1
            result=$2
            echo "- ${name}: ${result}" >> "$GITHUB_STEP_SUMMARY"
            case "$result" in
              success)
                ;;
              *)
                echo "::error title=${name} failed::${name} ended with '${result}'"
                failed=1
                ;;
            esac
          }

          echo "### Required CI" >> "$GITHUB_STEP_SUMMARY"
          check_result "Package metadata" "$PACKAGE_METADATA"
          check_result "Default package matrix" "$BUILD_TEST_DEFAULT"
          check_result "Eio package matrix" "$BUILD_TEST_EIO"
          check_result "Documentation and examples" "$DOCS_EXAMPLES"
          check_result "No-network correctness" "$NO_NETWORK_CORRECTNESS"
          check_result "S3 MinIO integration" "$S3_MINIO_INTEGRATION"

          exit "$failed"
