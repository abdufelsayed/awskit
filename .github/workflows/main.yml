name: Main workflow

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/**]
  schedule:
    # Prime the opam and dune caches every Monday.
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OCAML_LATEST: "5"
  DEFAULT_OPAM_PACKAGES: >-
    awskit awskit-unix awskit-lwt awskit-lwt-unix awskit-s3 awskit-s3-sim awskit-s3-lwt awskit-s3-lwt-unix
  DEFAULT_DUNE_PACKAGES: >-
    awskit,awskit-unix,awskit-lwt,awskit-lwt-unix,awskit-s3,awskit-s3-sim,awskit-s3-lwt,awskit-s3-lwt-unix
  EIO_OPAM_PACKAGES: >-
    awskit awskit-unix awskit-eio awskit-s3 awskit-s3-eio
  EIO_DUNE_PACKAGES: >-
    awskit,awskit-unix,awskit-eio,awskit-s3,awskit-s3-eio
  MINIO_OPAM_PACKAGES: >-
    awskit awskit-unix awskit-lwt awskit-lwt-unix awskit-eio
    awskit-s3 awskit-s3-lwt awskit-s3-lwt-unix awskit-s3-eio
  EXAMPLE_OPAM_PACKAGES: >-
    eio_main tls-eio tls ca-certs domain-name mirage-crypto-rng

jobs:
  build-test-default:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "4.14"
          - "5"
        local-packages:
          - |
            *.opam
            !awskit-eio.opam
            !awskit-s3-eio.opam

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: ${{ matrix.local-packages }}

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.DEFAULT_OPAM_PACKAGES }}

      - name: Build packages
        run: opam exec -- dune build -p "${{ env.DEFAULT_DUNE_PACKAGES }}" @install

      - name: Run tests
        run: opam exec -- dune build -p "${{ env.DEFAULT_DUNE_PACKAGES }}" @runtest

  build-test-eio:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "5"
          - "5.2"
        local-packages:
          - |
            awskit.opam
            awskit-unix.opam
            awskit-eio.opam
            awskit-s3.opam
            awskit-s3-eio.opam

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: ${{ matrix.local-packages }}

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.EIO_OPAM_PACKAGES }}

      - name: Build packages
        run: opam exec -- dune build -p "${{ env.EIO_DUNE_PACKAGES }}" @install

      - name: Run tests
        run: opam exec -- dune build -p "${{ env.EIO_DUNE_PACKAGES }}" @runtest

  docs-examples:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install documentation and example dependencies
        run: |
          opam install --with-test --with-doc --deps-only .
          opam install ${{ env.EXAMPLE_OPAM_PACKAGES }}

      - name: Build examples and documentation
        run: opam exec -- dune build @examples @doc

  no-network-correctness:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install dependencies
        run: opam install --with-test --with-doc --deps-only .

      - name: Build no-network correctness evidence
        run: scripts/test-report.sh quick --label no-network-correctness

      - name: Upload no-network correctness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-network-correctness-report
          path: .logs/
          if-no-files-found: ignore

  s3-minio-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.MINIO_OPAM_PACKAGES }}

      - name: Run MinIO integration checks
        run: scripts/test-report.sh integration --label s3-minio-integration

      - name: Upload MinIO integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-minio-integration-report
          path: .logs/
          if-no-files-found: ignore

  publish-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-test-default
      - build-test-eio
      - docs-examples
      - no-network-correctness
      - s3-minio-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install documentation dependencies
        run: opam install --with-doc --deps-only .

      - name: Build documentation
        run: opam exec -- dune build @doc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/default/_doc/_html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
