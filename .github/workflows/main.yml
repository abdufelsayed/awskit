name: Main workflow

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, release/**]
  schedule:
    # Prime the opam and dune caches every Monday.
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OCAML_LATEST: "5"
  DEFAULT_OPAM_PACKAGES: >-
    awskit awskit-unix awskit-lwt awskit-lwt-unix awskit-s3 awskit-s3-sim awskit-s3-lwt awskit-s3-lwt-unix
  DEFAULT_DUNE_PACKAGES: >-
    awskit,awskit-unix,awskit-lwt,awskit-lwt-unix,awskit-s3,awskit-s3-sim,awskit-s3-lwt,awskit-s3-lwt-unix
  EIO_OPAM_PACKAGES: >-
    awskit awskit-unix awskit-eio awskit-s3 awskit-s3-eio
  EIO_DUNE_PACKAGES: >-
    awskit,awskit-unix,awskit-eio,awskit-s3,awskit-s3-eio

jobs:
  build-test-default:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "4.14"
          - "5"
        local-packages:
          - |
            *.opam
            !awskit-eio.opam
            !awskit-s3-eio.opam

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: ${{ matrix.local-packages }}

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.DEFAULT_OPAM_PACKAGES }}

      - name: Build packages
        run: opam exec -- dune build -p "${{ env.DEFAULT_DUNE_PACKAGES }}" @install

      - name: Run tests
        run: opam exec -- dune build -p "${{ env.DEFAULT_DUNE_PACKAGES }}" @runtest

  build-test-eio:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ocaml-compiler:
          - "5"
          - "5.2"
        local-packages:
          - |
            awskit.opam
            awskit-unix.opam
            awskit-eio.opam
            awskit-s3.opam
            awskit-s3-eio.opam

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
          opam-local-packages: ${{ matrix.local-packages }}

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.EIO_OPAM_PACKAGES }}

      - name: Build packages
        run: opam exec -- dune build -p "${{ env.EIO_DUNE_PACKAGES }}" @install

      - name: Run tests
        run: opam exec -- dune build -p "${{ env.EIO_DUNE_PACKAGES }}" @runtest

  s3-minio-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam
            !awskit-eio.opam
            !awskit-s3-eio.opam

      - name: Install dependencies
        run: opam install --with-test --deps-only ${{ env.DEFAULT_OPAM_PACKAGES }}

      - name: Start MinIO
        run: docker compose up -d

      - name: Run S3 contract
        run: opam exec -- dune build --force @minio-contract

      - name: Dump MinIO logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop MinIO
        if: always()
        run: docker compose down -v
