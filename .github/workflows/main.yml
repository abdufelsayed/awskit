name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OCAML_VERSION: "5.3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml ${{ env.OCAML_VERSION }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}
          dune-cache: true

      - name: Install dependencies
        run: |
          opam install . --deps-only --with-test
          opam install ocamlformat.0.29.0

      - name: Check formatting
        run: |
          opam exec -- dune build @fmt
          git diff --exit-code

      - name: Build
        run: opam exec -- dune build

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data

      - name: Create MinIO test bucket
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          until mc alias set local http://localhost:9000 minioadmin minioadmin; do
            sleep 1
          done
          until mc ready local; do
            sleep 1
          done
          mc mb --ignore-existing local/test-bucket

      - name: Test
        run: opam exec -- dune test

      - name: Dump MinIO logs on failure
        if: failure()
        run: docker logs minio

      - name: Cleanup MinIO
        if: always()
        run: docker rm -f minio
