name: Stress tests

on:
  workflow_dispatch:
    inputs:
      qcheck_count:
        description: QCheck count for no-network stress aliases
        required: false
        default: "2000"
        type: string
  schedule:
    # Run explicit high-cost discovery weekly, separate from required PR CI.
    - cron: 0 1 * * MON

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OCAML_LATEST: "5"
  AWSKIT_STRESS_QCHECK_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.qcheck_count || '2000' }}

jobs:
  stress:
    name: Stress tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}
          dune-cache: true
          opam-local-packages: |
            *.opam

      - name: Install stress test dependencies
        run: opam install --yes --with-test --with-doc --with-dev-setup --deps-only .

      - name: Run no-service stress tests
        run: AWSKIT_QCHECK_COUNT="$AWSKIT_STRESS_QCHECK_COUNT" scripts/test.sh stress --label stress-evidence

      - name: Run expensive local-service integration tests
        run: AWSKIT_INTEGRATION_PROFILE=expensive scripts/test.sh integration --label local-service-expensive

      - name: Upload stress test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-evidence-report
          path: .logs/
          if-no-files-found: ignore
